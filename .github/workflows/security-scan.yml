name: Security Scan

on:
  schedule:
    - cron: '11 6 * * 1'
  push:
    branches: [main]
    paths:
      - 'app/requirements.txt'
      - 'package.json'
      - 'package-lock.json'
      - 'api/search.js'
      - '.github/workflows/security-scan.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/requirements.txt'
      - 'package.json'
      - 'package-lock.json'
      - 'api/search.js'
      - '.github/workflows/security-scan.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'app/requirements.txt'

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Run pip-audit
        run: |
          echo "Scanning dependencies for known vulnerabilities..."
          python -m pip_audit -r app/requirements.txt --desc

  node-dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'
          cache: 'npm'

      - name: Audit production dependencies
        run: |
          echo "Scanning Node dependencies for known vulnerabilities..."
          npm audit --package-lock-only --omit=dev
